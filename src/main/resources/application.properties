spring.application.name=nonna

# --- Conexão com o banco de dados ---
# O Spring lê estas três linhas e cria o pool de conexões sozinho.
# Não é preciso escrever nenhum código Java para isso.

# URL de conexão JDBC:
#   jdbc:mysql://  → protocolo (diz ao Java que é um MySQL)
#   localhost:3306 → endereço e porta onde o MySQL está rodando
#   /nonna-db      → nome do banco criado no cardapio.sql
spring.datasource.url=jdbc:mysql://localhost:3306/nonna-db

# Usuário e senha configurados ao subir o MySQL (Docker ou XAMPP).
spring.datasource.username=root
spring.datasource.password=root
